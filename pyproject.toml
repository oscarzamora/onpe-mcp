[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onpe-mcp"
version = "0.1.0"
description = "Servidor MCP para consulta y actualización de datos ONPE usando onpescraper"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "ONPE MCP" }
]
dependencies = [
  "mcp>=1.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "jsonschema>=4.0",
]

[project.scripts]
onpe-mcp = "onpe_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
